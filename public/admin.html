<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#0b1329', cardBg: '#111c38', accentBlue: '#00f2fe', neonGreen: '#00ff87' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans p-4 space-y-6">
    <h1 class="text-xl font-bold text-accentBlue mb-4"><i class="fa-solid fa-user-shield"></i> Admin Control Panel</h1>
    <div class="bg-cardBg rounded-2xl p-4 border border-gray-800 space-y-3">
        <h2 class="text-sm font-bold text-white border-b border-gray-800 pb-2">Pending Deposits (Binance Pay)</h2>
        <div class="flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800 text-xs">
            <div>
                <p class="font-bold text-white">User ID: sample_user_id</p>
                <p class="text-neonGreen font-semibold">Amount: 1280 BDT (10 USD)</p>
            </div>
            <button onclick="approveDeposit('SAMPLE_USER_ID', 1280)" class="bg-neonGreen/20 text-neonGreen px-3 py-1.5 rounded-lg font-bold">Approve</button>
        </div>
    </div>
    <script>
        async function approveDeposit(userId, depositAmount) {
            try {
                const response = await fetch('/api/admin/approve-deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, depositAmount })
                });
                const data = await response.json();
                alert(data.message);
            } catch (err) { alert('Server connection error!'); }
        }
    </script>
</body>
</html>
