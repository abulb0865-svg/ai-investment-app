<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Deposit & Withdraw</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .admin-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex: 1;
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .deposit-btn {
            background: #22c55e;
        }
        .deposit-btn:hover {
            background: #16a34a;
        }
        .withdraw-btn {
            background: #ef4444;
        }
        .withdraw-btn:hover {
            background: #dc2626;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- ডিপোজিট সেকশন -->
        <div class="admin-card">
            <h3>Approve Deposit</h3>
            <div class="form-group">
                <label>User ID:</label>
                <input type="text" id="depUserId" placeholder="User MongoDB ID">
            </div>
            <div class="form-group">
                <label>Amount:</label>
                <input type="number" id="depAmount" placeholder="Deposit Amount">
            </div>
            <button class="deposit-btn" onclick="handleAction('deposit')">Add Balance</button>
            <div id="depMessage" class="message"></div>
        </div>

        <!-- উইথড্র সেকশন -->
        <div class="admin-card">
            <h3>Approve Withdraw</h3>
            <div class="form-group">
                <label>User ID:</label>
                <input type="text" id="withUserId" placeholder="User MongoDB ID">
            </div>
            <div class="form-group">
                <label>Amount:</label>
                <input type="number" id="withAmount" placeholder="Withdraw Amount">
            </div>
            <button class="withdraw-btn" onclick="handleAction('withdraw')">Deduct Balance</button>
            <div id="withMessage" class="message"></div>
        </div>
    </div>

    <script>
        async function handleAction(type) {
            let userId, amount, endpoint, messageId;

            if (type === 'deposit') {
                userId = document.getElementById('depUserId').value.trim();
                amount = parseFloat(document.getElementById('depAmount').value);
                endpoint = '/api/admin/approve-deposit';
                messageId = document.getElementById('depMessage');
            } else {
                userId = document.getElementById('withUserId').value.trim();
                amount = parseFloat(document.getElementById('withAmount').value);
                endpoint = '/api/admin/approve-withdraw';
                messageId = document.getElementById('withMessage');
            }

            if (!userId || isNaN(amount)) {
                messageId.style.color = '#ef4444';
                messageId.innerText = 'দয়া করে সঠিক User ID এবং Amount দিন!';
                return;
            }

            messageId.style.color = '#38bdf8';
            messageId.innerText = 'প্রক্রিয়াধীন আছে...';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(type === 'deposit' ? { userId, depositAmount: amount } : { userId, withdrawAmount: amount })
                });

                const data = await response.json();

                if (data.success) {
                    messageId.style.color = '#22c55e';
                    messageId.innerText = data.message;
                } else {
                    messageId.style.color = '#ef4444';
                    messageId.innerText = 'ত্রুটি: ' + data.message;
                }
            } catch (error) {
                messageId.style.color = '#ef4444';
                messageId.innerText = 'সার্ভারে কানেক্ট করা যায়নি!';
            }
        }
    </script>

</body>
</html>
