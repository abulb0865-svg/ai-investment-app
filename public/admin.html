<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Approve Deposit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #22c55e;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #16a34a;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Admin Approval Panel</h2>
        <div class="form-group">
            <label for="userId">User ID:</label>
            <input type="text" id="userId" placeholder="ইউজারের MongoDB ID দিন">
        </div>
        <div class="form-group">
            <label for="depositAmount">Deposit Amount (BDT/USD):</label>
            <input type="number" id="depositAmount" placeholder="টাকার পরিমাণ দিন (যেমন: 7040)">
        </div>
        <button onclick="approveDeposit()">Approve Deposit</button>
        <div id="message"></div>
    </div>

    <script>
        async function approveDeposit() {
            const userId = document.getElementById('userId').value.trim();
            const depositAmount = parseFloat(document.getElementById('depositAmount').value);
            const messageDiv = document.getElementById('message');

            if (!userId || isNaN(depositAmount)) {
                messageDiv.style.color = '#ef4444';
                messageDiv.innerText = 'দয়া করে সঠিক User ID এবং Amount দিন!';
                return;
            }

            messageDiv.style.color = '#38bdf8';
            messageDiv.innerText = 'প্রক্রিয়াধীন আছে...';

            try {
                const response = await fetch('/api/admin/approve-deposit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, depositAmount })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.style.color = '#22c55e';
                    messageDiv.innerText = data.message;
                } else {
                    messageDiv.style.color = '#ef4444';
                    messageDiv.innerText = 'ত্রুটি: ' + data.message;
                }
            } catch (error) {
                messageDiv.style.color = '#ef4444';
                messageDiv.innerText = 'সার্ভারে কানেক্ট করা যায়নি!';
            }
        }
    </script>

</body>
</html>
